name: نشر أخبار كرة القدم التلقائي (كل ساعة)

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-news-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: تنزيل نسخة المستودع
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: إعداد بايثون
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: تثبيت المكتبات المطلوبة
        run: pip install -r requirements.txt

      - name: تشغيل السكربت
        env:
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: حفظ قاعدة بيانات منع التكرار (news.db) داخل المستودع
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add news.db
          if git commit -m "تحديث news.db [skip ci]"; then
            git push origin HEAD:${{ github.ref }}
          else
            echo "لا يوجد تغييرات جديدة في قاعدة البيانات."
          fi
